<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073b83">
<title>KA · Asistente K124</title>
<style>
:root{color-scheme:light;--blue:#073b83;--pale:#eaf3ff;--orange:#ff7900;--ink:#172b49;--muted:#64748b;--line:#dce6f2}
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(145deg,#07509b,#041b46);color:white;padding:30px 20px 25px;text-align:center;border-bottom:6px solid var(--orange)}
h1{font-size:54px;font-weight:900;font-style:italic;letter-spacing:-2px;margin:0}header p{margin:5px 0 0;color:#dceaff}
main{max-width:760px;margin:20px auto;padding:0 14px 40px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #183b2910}
h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted);font-size:14px;line-height:1.5}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #bdcde0;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:linear-gradient(110deg,#0879df,#073b83);color:white;width:100%;margin-top:12px}.secondary{background:var(--pale);color:var(--blue)}
.status{padding:10px 12px;border-radius:10px;background:#f1f5f9;color:#475569;font-size:14px;margin-top:12px}.ok{background:#e3f4e8;color:#14532d}.bad{background:#fff0ee;color:#9f2920}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{background:#f6f9fd;border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}.item strong{display:block;font-size:14px;overflow-wrap:anywhere}.item span{font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1b2e;color:#e4efff;padding:13px;border-radius:10px;font-size:12px;max-height:420px;overflow:auto}
.hidden{display:none}.foot{text-align:center;color:#8492a6;font-size:12px;padding:8px}
</style>
</head>
<body>
<header><h1>KA</h1><p>Asistente inteligente · K124 SL</p></header>
<main>
<section class="card">
<h2>Conectar con K124</h2>
<p class="muted">Introduce la clave privada de KA. Se utilizará solo en esta sesión y no se guardará en este dispositivo.</p>
<label for="accessKey">Clave de acceso</label>
<input id="accessKey" type="password" autocomplete="off" placeholder="Tu clave privada de KA">
<button class="primary" id="connect">Conectar y consultar</button>
<div id="status" class="status">Sin conexión</div>
</section>
<section id="results" class="card hidden">
<h2>Datos recibidos de K124</h2>
<p class="muted" id="updated"></p>
<div class="grid" id="keys"></div>
<h2 style="margin-top:18px">Contenido recibido</h2>
<pre id="raw"></pre>
<button class="secondary" id="refresh">Actualizar consulta</button>
</section>
<p class="foot">KA · K124 SL · Acceso de solo lectura</p>
</main>
<script>
const ENDPOINT="https://nkbmgtffoxwyfbeznver.supabase.co/functions/v1/ka-consulta";
const $=id=>document.getElementById(id);
let sessionKey="";
function showStatus(message,kind=""){ $("status").textContent=message;$("status").className="status "+kind; }
function labelFor(key){return key.replace(/^k124_/,"").replace(/_v[0-9]+$/,"").replaceAll("_"," ");}
async function connect(){
 const key=$("accessKey").value.trim();
 if(!key){showStatus("Introduce tu clave privada.","bad");return;}
 sessionKey=key;
 $("connect").disabled=true;showStatus("Consultando K124…");
 try{
  const response=await fetch(ENDPOINT,{method:"GET",headers:{"x-ka-key":sessionKey}});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||("Error HTTP "+response.status));
  if(!result.ok||!result.datos)throw new Error("La respuesta no contiene los datos esperados.");
  $("updated").textContent="Última actualización registrada: "+(result.actualizado||"no indicada");
  const entries=Object.entries(result.datos);
  $("keys").innerHTML=entries.map(([k,v])=>'<div class="item"><strong>'+labelFor(k)+'</strong><span>'+(Array.isArray(v)?"Lista · "+v.length+" elementos":v&&typeof v==="object"?"Datos estructurados":String(v).slice(0,70))+'</span></div>').join("");
  $("raw").textContent=JSON.stringify(result.datos,null,2);
  $("results").classList.remove("hidden");
  showStatus("Conexión correcta · K124 consultado en modo lectura.","ok");
 }catch(error){showStatus("No se pudo consultar: "+error.message,"bad");}
 finally{$("connect").disabled=false;}
}
$("connect").addEventListener("click",connect);
$("refresh").addEventListener("click",connect);
$("accessKey").addEventListener("keydown",e=>{if(e.key==="Enter")connect();});
document.addEventListener("visibilitychange",()=>{if(document.hidden){sessionKey="";$("accessKey").value="";}});
</script>
</body>
</html>
