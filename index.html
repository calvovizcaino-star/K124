<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b2a">
  <title>K124 | Parte diario</title>
  <style>
    :root{--verde:#123b2a;--verde-claro:#e7f4ec;--fondo:#f3f6f4;--texto:#202820;--borde:#dce5df}
    *{box-sizing:border-box}
    body{margin:0;background:var(--fondo);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:var(--verde);color:white;padding:25px 20px;text-align:center}
    header h1{margin:0;font-size:28px;letter-spacing:2px}
    header p{margin:7px 0 0;opacity:.85;font-size:14px}
    main{width:min(100% - 28px,540px);margin:22px auto 40px}
    .panel{background:white;border:1px solid var(--borde);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #183b2910}
    h2{font-size:18px;margin:0 0 15px}
    .ayuda{color:#647168;font-size:14px;line-height:1.5}
    input[type=file]{width:100%;margin:12px 0;font-size:14px}
    button{border:0;border-radius:10px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer}
    .principal{width:100%;background:var(--verde);color:white}
    .resultado{display:none}
    .fecha{color:#607168;margin:-5px 0 16px;font-size:14px}
    .fila{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--borde);gap:12px}
    .fila:last-child{border-bottom:0}
    .combustible{font-weight:600}
    .litros{font-size:18px;font-weight:700;white-space:nowrap}
    .total{background:var(--verde-claro);margin:16px -4px 0;padding:17px 14px;border-radius:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
    .total strong:last-child{font-size:23px;color:var(--verde);white-space:nowrap}
    .mensaje{display:none;padding:12px;border-radius:10px;background:#fff2df;color:#754500;font-size:14px;line-height:1.5;margin-top:12px}
    .pie{text-align:center;color:#748078;font-size:12px;padding:8px}
  </style>
</head>
<body>
  <header><h1>K124</h1><p>Control del parte diario</p></header>
  <main>
    <section class="panel">
      <h2>📄 Cargar parte diario</h2>
      <p class="ayuda">Selecciona el archivo TXT del parte de la gasolinera. Calcularemos las ventas de cada combustible.</p>
      <input id="archivo" type="file" accept=".txt,text/plain">
      <button class="principal" id="procesar">Leer parte diario</button>
      <div class="mensaje" id="mensaje" role="status"></div>
    </section>
    <section class="panel resultado" id="resultado">
      <h2>⛽ Ventas por combustible</h2><p class="fecha" id="fecha"></p>
      <div class="fila"><span class="combustible">Diésel E+</span><span class="litros" id="eplus">—</span></div>
      <div class="fila"><span class="combustible">Diésel E+10</span><span class="litros" id="eplus10">—</span></div>
      <div class="fila"><span class="combustible">Gasolina 95</span><span class="litros" id="g95">—</span></div>
      <div class="fila"><span class="combustible">Gasolina 98</span><span class="litros" id="g98">—</span></div>
      <div class="total"><strong>Total vendido</strong><strong id="total">—</strong></div>
    </section>
    <p class="pie">K124 · Herramienta de uso interno</p>
  </main>
  <script>
    const archivo=document.getElementById("archivo"),boton=document.getElementById("procesar"),mensaje=document.getElementById("mensaje"),resultado=document.getElementById("resultado");
    function mostrarMensaje(texto){mensaje.textContent=texto;mensaje.style.display="block"}
    function numeroES(valor){return Number(valor).toLocaleString("es-ES",{maximumFractionDigits:2})}
    function buscarVentas(texto){
      const lineas=texto.replace(/\r/g,"").split("\n");
      const inicio=lineas.findIndex(linea=>/Pro\s+St\.Mi\.\s+Stock\s+Compras\s+Venta/i.test(linea));
      if(inicio===-1)throw new Error("No encuentro el bloque de ventas por combustible. Comprueba que has seleccionado el parte diario correcto.");
      const ventas={};let totalInformado=null,finEncontrado=false;
      for(let i=inicio+1;i<lineas.length;i++){
        const linea=lineas[i].trim();
        if(/^Suma\b/i.test(linea)){
          const coincidencia=linea.match(/^Suma\s+.*?\s+([\d.,]+)\s+L\./i);
          if(coincidencia)totalInformado=parseFloat(coincidencia[1].replace(/\./g,"").replace(",","."));
          finEncontrado=true;break;
        }
        const coincidencia=linea.match(/^(E\+10|E\+|G\s*95|G\s*98)\s+.*?\s+(\d+(?:[.,]\d+)?)\s+[\d.,]+\s+[\d.,]+$/i);
        if(!coincidencia)continue;
        const clave=coincidencia[1].toUpperCase().replace(/\s/g,"");
        ventas[clave]=Number(coincidencia[2].replace(",","."));
      }
      if(!finEncontrado||!["E+","E+10","G95","G98"].every(k=>Number.isFinite(ventas[k])))throw new Error("No he podido identificar las cuatro ventas y su total. El formato del archivo puede ser distinto.");
      const suma=ventas["E+"]+ventas["E+10"]+ventas["G95"]+ventas["G98"];
      if(totalInformado!==null&&suma!==totalInformado)throw new Error("Los litros por combustible no coinciden con el total del parte. No mostraré un resultado dudoso.");
      const fecha=texto.match(/\b(\d{2}[/-]\d{2}[/-]\d{4})\b/);
      return{fecha:fecha?fecha[1].replace(/-/g,"/"):"Fecha no detectada",ventas,total:suma};
    }
    boton.addEventListener("click",async()=>{
      mensaje.style.display="none";resultado.style.display="none";
      const fichero=archivo.files[0];if(!fichero){mostrarMensaje("Primero selecciona el archivo TXT.");return}
      try{
        const texto=await fichero.text(),datos=buscarVentas(texto);
        document.getElementById("fecha").textContent="Fecha del parte: "+datos.fecha;
        document.getElementById("eplus").textContent=numeroES(datos.ventas["E+"])+" L";
        document.getElementById("eplus10").textContent=numeroES(datos.ventas["E+10"])+" L";
        document.getElementById("g95").textContent=numeroES(datos.ventas["G95"])+" L";
        document.getElementById("g98").textContent=numeroES(datos.ventas["G98"])+" L";
        document.getElementById("total").textContent=numeroES(datos.total)+" L";
        resultado.style.display="block";resultado.scrollIntoView({behavior:"smooth"});
      }catch(error){mostrarMensaje(error.message||"No se ha podido leer el archivo.")}
    });
  </script>
</body>
</html>
