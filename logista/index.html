<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b2b"><link rel="manifest" href="./manifest.webmanifest"><title>LOGISTA · Control de pagos</title><style>
:root{--g:#173b2b;--g2:#236342;--bg:#f3f6f3;--line:#dce5dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17231c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--g);color:white;padding:24px 18px;border-radius:0 0 22px 22px}header b{font-size:28px;letter-spacing:2px}header small{display:block;opacity:.8;letter-spacing:1px}main{max-width:720px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.muted,label{color:#66736b;font-size:13px}.big{display:block;font-size:24px;font-weight:800;margin-top:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}button,.pick{border:0;border-radius:13px;padding:14px;font-weight:750;font-size:14px;text-align:center;cursor:pointer}.green{background:var(--g2);color:white}.white{background:white;color:var(--g);border:1px solid var(--line)}.pick input{display:none}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields label{display:block}.fields input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:16px;margin-top:5px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1;background:#e6ece7}.tabs .on{background:var(--g);color:white}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.amount{font-size:19px;font-weight:800;color:var(--g)}.invoice{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:8px}.status{font-size:11px;background:#fff1d8;padding:4px 8px;border-radius:20px}.paid{background:#e2f2e7}.hidden{display:none!important}.save{width:100%;background:var(--g);color:white;margin-top:12px}.small{padding:8px;font-size:12px;background:#eef3ef;margin-top:6px}
</style></head><body><header><b>LOGISTA</b><small>CONTROL DE PAGOS</small></header><main>
<div class="grid"><div class="card"><span class="muted">Pendiente de pago</span><strong class="big" id="sum">0,00 €</strong></div><div class="card"><span class="muted">Próximos vencimientos</span><strong class="big" id="count">0</strong></div></div>
<div class="actions"><label class="pick green">📷 HACER FOTO<input id="cam" type="file" accept="image/*" capture="environment"></label><label class="pick white">▧ AÑADIR FOTO<input id="gal" type="file" accept="image/*"></label></div>
<div id="scan" class="card hidden"><b>Fotografía del albarán</b><p class="muted" id="msg">Leyendo…</p><img id="preview" style="width:100%;max-height:220px;object-fit:contain"></div>
<div id="form" class="card hidden"><b>Revisar albarán</b><p class="muted">Comprueba los datos antes de guardar.</p><div class="fields"><label>N.º albarán<input id="num"></label><label>Fecha albarán<input id="doc" type="date"></label><label>Fecha de pago<input id="due" type="date" required></label><label>Total a pagar (€)<input id="total" inputmode="decimal" required></label></div><button class="save" id="save">GUARDAR ALBARÁN</button><p class="muted">El PVP nunca se utiliza para sumar pagos.</p></div>
<div class="tabs"><button class="on" id="bt1">Pendientes</button><button id="bt2">Pagados</button></div><section id="pending"><h3>Pagos por fecha</h3><div id="groups"></div></section><section id="history" class="hidden"><h3>Histórico de pagos</h3><div id="paid"></div></section><p class="muted" style="text-align:center">Datos guardados en este dispositivo.</p></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=x=>document.getElementById(x),fmt=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});let data=JSON.parse(localStorage.getItem('logista_docs')||'[]');
function date(t){let m=t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
function parse(t){let a=t.split(/\n/).map(x=>x.trim()),d='',f='',n='',v='';for(let i=0;i<a.length;i++){let l=a[i],z=l.toLowerCase();if(/end\s*date|fecha.*(vencimiento|pago)|vencimiento/.test(z))d=date(l)||date(a[i+1]||'');if(/fecha/.test(z)&&!f)f=date(l)||date(a[i+1]||'');if(/albar[aá]n|delivery note/.test(z)&&!n)n=(l.match(/\b\d{7,14}\b/)||[])[0]||'';if(/total\s*(a\s*)?(pagar|payable)|importe\s*total/.test(z)){let m=(l+' '+(a[i+1]||'')).match(/\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2}/);if(m)v=m[0].replace(/\./g,'').replace(',','.')}}return{d,f,n,v}}
async function photo(file){if(!file)return;$('scan').classList.remove('hidden');$('form').classList.add('hidden');$('preview').src=URL.createObjectURL(file);$('msg').textContent='Leyendo la fotografía…';try{let r=await Tesseract.recognize(file,'spa+eng');let x=parse(r.data.text);$('num').value=x.n;$('doc').value=x.f;$('due').value=x.d;$('total').value=x.v;$('msg').textContent='Lectura terminada. Revisa fecha de pago y total a pagar.'}catch(e){$('msg').textContent='No se pudo leer automáticamente. Introduce los datos manualmente.'} $('form').classList.remove('hidden')}
$('cam').onchange=e=>photo(e.target.files[0]);$('gal').onchange=e=>photo(e.target.files[0]);
$('save').onclick=()=>{let due=$('due').value,total=Number($('total').value.replace(',','.'));if(!due||!Number.isFinite(total)||total<=0)return alert('Indica fecha de pago y total a pagar válido.');data.unshift({id:Date.now(),n:$('num').value,due,total,paid:false});store();$('form').classList.add('hidden');$('scan').classList.add('hidden')};
function store(){localStorage.setItem('logista_docs',JSON.stringify(data));draw()}
function draw(){let p=data.filter(x=>!x.paid),h=data.filter(x=>x.paid),g={};p.forEach(x=>(g[x.due]??=[]).push(x));$('sum').textContent=fmt(p.reduce((s,x)=>s+x.total,0));$('count').textContent=Object.keys(g).length;$('groups').innerHTML=Object.keys(g).sort().map(k=>'<div class="card"><div class="row"><b>'+new Date(k+'T12:00:00').toLocaleDateString('es-ES')+'</b><b class="amount">'+fmt(g[k].reduce((s,x)=>s+x.total,0))+'</b></div>'+g[k].map(item).join('')+'</div>').join('')||'<div class="card muted">No hay albaranes pendientes.</div>';$('paid').innerHTML=h.map(item).join('')||'<div class="card muted">No hay pagos registrados.</div>'}
function item(x){return '<div class="invoice"><div><b>Albarán '+(x.n||'sin número')+'</b><div class="muted">Pago: '+new Date(x.due+'T12:00:00').toLocaleDateString('es-ES')+'</div><span class="status '+(x.paid?'paid':'')+'">'+(x.paid?'Pagado':'Pendiente')+'</span>'+(x.paid?'':'<br><button class="small" onclick="pay('+x.id+')">Marcar como pagado</button>')+'</div><b>'+fmt(x.total)+'</b></div>'}
window.pay=id=>{let x=data.find(y=>y.id===id);if(confirm('¿Confirmas que está pagado?')){x.paid=true;store()}};$('bt1').onclick=()=>tab(false);$('bt2').onclick=()=>tab(true);function tab(h){$('pending').classList.toggle('hidden',h);$('history').classList.toggle('hidden',!h);$('bt1').classList.toggle('on',!h);$('bt2').classList.toggle('on',h)}draw();
</script></body></html>
